name: Publish to npm

on:
  release:
    types: [published]

jobs:
  ci:
    name: Run CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all packages
        run: |
          npm run build --workspace=packages/shared
          npm run build --workspace=packages/core
          npm run build --workspace=packages/cli
          npm run build --workspace=packages/mcp

      - name: Copy migration files
        run: cp -r packages/core/src/storage/migrations packages/core/dist/storage/migrations

      - name: Publish @pathseekr/shared
        run: npm publish --workspace=packages/shared --access=public --provenance

      - name: Publish @pathseekr/core
        run: npm publish --workspace=packages/core --access=public --provenance

      - name: Publish @pathseekr/cli
        run: npm publish --workspace=packages/cli --access=public --provenance

      - name: Publish @pathseekr/mcp
        run: npm publish --workspace=packages/mcp --access=public --provenance